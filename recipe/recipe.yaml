schema_version: 1

context:
  version: "0.5.0"

package:
  name: abvx-set
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/abvx-set/abvx_set-${{ version }}.tar.gz
  sha256: 946b5b20212c173af849de22c5ea51932cf1b126920c6b509578c4d54b2d9256

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - set-validate-registry = scripts.validate_registry:main
      - set-plan-config-apply = scripts.plan_config_apply:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=68
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - scripts
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - set-plan-config-apply --help
      - python -c "from pathlib import Path; Path('.set.json').write_text('{\"version\":1,\"repo\":\"conda-forge/smoke-test\",\"tools\":{\"agentsgen\":{\"init\":true,\"pack\":true,\"check\":true}},\"presets\":[\"repo-docs\"]}')"
      - set-plan-config-apply --config .set.json --repo-root . --format json --export-dir .set-plan
      - test -f .set-plan/workflow.set.yml
      - test -f .set-plan/pr-body.md

about:
  summary: SET workflow action helpers and registry tooling
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/markoblogo/SET
  repository: https://github.com/markoblogo/SET

extra:
  recipe-maintainers:
    - markoblogo
